<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>GENTLEMAN</title>
    <meta name="description" content="Mobile-first PWA booking app for GENTLEMAN Barber Lounge" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png?v=3" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png?v=3" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png?v=3" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png?v=3" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon-180x180.png?v=3" />
    <link rel="manifest" href="/manifest.json?v=3" />
    <meta property="og:title" content="GENTLEMAN" />
    <meta property="og:image" content="/icon-512.png?v=3" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GENTLEMAN" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="HandheldFriendly" content="true" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@300;400;500;600;700;800&family=Padauk:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Clean up legacy cached round logos from localStorage so new GTM icon is always used
      try {
        const savedLogo = localStorage.getItem('gentleman_shop_logo');
        if (savedLogo && (savedLogo.includes('logo_emblem') || savedLogo.includes('babashop') || !savedLogo.includes('data:image'))) {
          localStorage.removeItem('gentleman_shop_logo');
        }
      } catch (e) {}

      // Prevent unexpected gesture zoom & double-tap zoom for native app smoothness
      document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });
    </script>
  </head>
  <body class="bg-[#FAFAFA] text-[#18181B] antialiased overflow-x-hidden selection:bg-[#10B981] selection:text-white">
    <div id="root">
      <div id="app-init-splash" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FAFAFA; color: #18181B; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; z-index: 9999; padding: 24px; text-align: center;">
        <style>
          @keyframes splash-pulse {
            0%, 100% { transform: scale(1); opacity: 0.95; box-shadow: 0 0 25px rgba(16, 185, 129, 0.25); }
            50% { transform: scale(1.04); opacity: 1; box-shadow: 0 0 40px rgba(16, 185, 129, 0.45); }
          }
          @keyframes splash-shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
          }
          @keyframes splash-fade {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
          }
          .splash-icon {
            animation: splash-pulse 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
          }
          .splash-fadein {
            animation: splash-fade 0.8s ease-out forwards;
          }
        </style>
        
        <div class="splash-fadein" style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
          <!-- Clean GTM Emblem with green background -->
          <div class="splash-icon" style="width: 96px; height: 96px; border-radius: 22px; background: #059669; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; box-shadow: 0 8px 24px rgba(5, 150, 105, 0.25);">
            <img id="splash-logo-img" src="/logo.svg" alt="GENTLEMAN Logo" style="width: 100%; height: 100%; object-fit: contain;" />
            <script>
              if (window.__SAVED_LOGO) {
                var splashImg = document.getElementById('splash-logo-img');
                if (splashImg) splashImg.src = window.__SAVED_LOGO;
              }
            </script>
          </div>

          <!-- Brand Typography -->
          <div style="margin-top: 4px;">
            <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #18181B; font-family: 'Plus Jakarta Sans', sans-serif;">
              GENTLEMAN
            </h1>
            <p style="margin: 6px 0 0; font-size: 11px; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; color: #059669;">
              BARBER SHOP
            </p>
          </div>

          <!-- Progress Bar & Status -->
          <div style="margin-top: 24px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <div style="width: 140px; height: 3px; background: rgba(0, 0, 0, 0.08); border-radius: 999px; overflow: hidden; position: relative;">
              <div style="position: absolute; top: 0; left: 0; width: 50%; height: 100%; background: #10B981; border-radius: 999px; animation: splash-shimmer 1.5s ease-in-out infinite;"></div>
            </div>
            <span style="font-size: 12px; color: #71717A; letter-spacing: 0.04em; font-weight: 500;">
              ခေတ္တစောင့်ဆိုင်းပေးပါ • Loading Experience...
            </span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
